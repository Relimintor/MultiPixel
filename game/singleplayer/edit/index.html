<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiPixel Editor</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="edit-body">
  <main class="edit-shell">
    <header class="edit-header">
      <h1>Editor</h1>
      <button id="edit-back-btn" type="button">Back to Game</button>
    </header>

    <nav class="edit-tabs">
      <button class="edit-tab active" data-tab="texturepacks" type="button">Texture Packs</button>
      <button class="edit-tab" data-tab="mods" type="button">Mods</button>
    </nav>

    <section id="edit-panel-texturepacks" class="edit-panel"></section>
    <section id="edit-panel-mods" class="edit-panel hidden"></section>
  </main>

  <script src="./texturepack/main.js"></script>
  <script src="./mod/main.js"></script>
  <script src="./main.js"></script>
</body>
</html>
